# Local development stack: PostgreSQL + pgvector, the FastAPI backend, the ingestion worker
# and the Vite dev server.
#
#   cp .env.example .env
#   docker compose up --build
#
# Frontend: http://localhost:5173   API: http://localhost:8000/api/v1/health
#
# The worker and the API share BAAI/bge-m3 (about 2.3 GB) through the model-cache volume. It
# is downloaded the first time either one loads it. To download it ahead of time (recommended,
# so the first search does not wait for the download):
#
#   docker compose run --rm worker python -m app.worker prepare-model

name: yashrag

x-database-url: &database-url postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}

services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # One-off job: applies Alembic migrations, then exits. The backend waits for it to succeed.
  migrate:
    build:
      context: ./backend
      target: api
    image: yashrag-backend:dev
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      target: api
    image: yashrag-backend:dev
    # --reload with the source mounted gives a fast edit/refresh loop in development. Each
    # reload also reloads the embedding model, which takes a few seconds once it is cached.
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      DATABASE_URL: *database-url
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      # Search embeds queries with the same model and revision the worker indexes with.
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
      EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:-5617a9f61b028005a4858fdac845db406aefb181}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      EMBEDDING_LOCAL_FILES_ONLY: ${EMBEDDING_LOCAL_FILES_ONLY:-false}
      # Load the model in the background at startup instead of on the first search.
      SEARCH_PRELOAD_MODEL: ${SEARCH_PRELOAD_MODEL:-true}
      SEARCH_DEFAULT_MODE: ${SEARCH_DEFAULT_MODE:-semantic}
      SEARCH_DEFAULT_TOP_K: ${SEARCH_DEFAULT_TOP_K:-10}
      SEARCH_FUSION_DEPTH: ${SEARCH_FUSION_DEPTH:-50}
      SEARCH_RRF_K: ${SEARCH_RRF_K:-60}
      OMP_NUM_THREADS: ${BACKEND_TORCH_THREADS:-2}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app:ro
      - uploads:/data/uploads
      - model-cache:/models
    # The model takes about 2.3 GB of memory in this process (and again in the worker).
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY:-4g}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Ingestion worker: claims jobs from PostgreSQL, extracts and chunks text and runs BGE-M3.
  # Restart or scale it independently of the API.
  worker:
    build:
      context: ./backend
      target: worker
    image: yashrag-worker:dev
    environment:
      DATABASE_URL: *database-url
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
      EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:-5617a9f61b028005a4858fdac845db406aefb181}
      # Docker on macOS cannot use the Apple GPU (MPS), so the container runs on CPU.
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-8}
      EMBEDDING_LOCAL_FILES_ONLY: ${EMBEDDING_LOCAL_FILES_ONLY:-false}
      CHUNK_TARGET_TOKENS: ${CHUNK_TARGET_TOKENS:-400}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-60}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      # PyTorch CPU threads; keep at or below WORKER_CPUS.
      OMP_NUM_THREADS: ${WORKER_TORCH_THREADS:-4}
    volumes:
      - ./backend/app:/app/app:ro
      - uploads:/data/uploads
      - model-cache:/models
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPUS:-4}"
          memory: ${WORKER_MEMORY:-6g}
    stop_grace_period: 45s
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    image: yashrag-frontend:dev
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  # Original uploaded files, shared by the API (writes) and the worker (reads).
  uploads:
  # Hugging Face cache with the BGE-M3 weights; survives container rebuilds.
  model-cache:
