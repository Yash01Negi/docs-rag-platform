# Local development stack: PostgreSQL + pgvector, the FastAPI backend, the ingestion worker
# and the Vite dev server.
#
#   cp .env.example .env
#   docker compose up --build
#
# Frontend: http://localhost:5173   API: http://localhost:8000/api/v1/health
#
# S3 connectors (Phase 5) read from Amazon S3 with the worker's AWS credentials (see
# docs/s3-setup.md). To try them without AWS, start the optional MinIO emulator:
#
#   docker compose --profile s3-local up --build
#
# The worker and the API share BAAI/bge-m3 (about 2.3 GB) through the model-cache volume. It
# is downloaded the first time either one loads it. To download it ahead of time (recommended,
# so the first search does not wait for the download):
#
#   docker compose run --rm worker python -m app.worker prepare-model

name: yashrag

# Connector settings shared by the API (validation) and the worker (S3 access). Credentials
# are only given to the worker, below; the API never contacts S3.
x-s3-settings: &s3-settings
  S3_ALLOWED_SOURCES: ${S3_ALLOWED_SOURCES:-}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_REGION: ${S3_REGION:-}
  S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-auto}
  S3_MAX_OBJECT_BYTES: ${S3_MAX_OBJECT_BYTES:-20971520}
  S3_MAX_OBJECTS_PER_SYNC: ${S3_MAX_OBJECTS_PER_SYNC:-10000}
  CONNECTOR_SYNC_CONCURRENCY: ${CONNECTOR_SYNC_CONCURRENCY:-1}
  CONNECTOR_SYNC_MAX_ATTEMPTS: ${CONNECTOR_SYNC_MAX_ATTEMPTS:-3}

x-database-url: &database-url postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}

services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # One-off job: applies Alembic migrations, then exits. The backend waits for it to succeed.
  migrate:
    build:
      context: ./backend
      target: api
    image: yashrag-backend:dev
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      target: api
    image: yashrag-backend:dev
    # --reload with the source mounted gives a fast edit/refresh loop in development. Each
    # reload also reloads the embedding model, which takes a few seconds once it is cached.
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      <<: *s3-settings
      DATABASE_URL: *database-url
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      # Search embeds queries with the same model and revision the worker indexes with.
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
      EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:-5617a9f61b028005a4858fdac845db406aefb181}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      EMBEDDING_LOCAL_FILES_ONLY: ${EMBEDDING_LOCAL_FILES_ONLY:-false}
      # Load the model in the background at startup instead of on the first search.
      SEARCH_PRELOAD_MODEL: ${SEARCH_PRELOAD_MODEL:-true}
      SEARCH_DEFAULT_MODE: ${SEARCH_DEFAULT_MODE:-semantic}
      SEARCH_DEFAULT_TOP_K: ${SEARCH_DEFAULT_TOP_K:-10}
      SEARCH_FUSION_DEPTH: ${SEARCH_FUSION_DEPTH:-50}
      SEARCH_RRF_K: ${SEARCH_RRF_K:-60}
      # Chat (Phase 4, 4.1). Keys are passed through from the host environment or .env only.
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODELS: ${ANTHROPIC_MODELS:-claude-opus-5-5,claude-sonnet-5-5,claude-haiku-5-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODELS: ${GEMINI_MODELS:-gemini-3.8-flash,gemini-3.5-flash-lite}
      GEMINI_TIER: ${GEMINI_TIER:-free}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-}
      # Ollama on the host (macOS app or Linux service). Leave OLLAMA_MODELS empty to turn
      # Ollama off; host.docker.internal is mapped below for Linux too.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODELS: ${OLLAMA_MODELS:-}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-16384}
      OLLAMA_THINK: ${OLLAMA_THINK:-}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-}
      OLLAMA_ALLOW_REMOTE_MODELS: ${OLLAMA_ALLOW_REMOTE_MODELS:-false}
      LLM_CATALOG_TTL_SECONDS: ${LLM_CATALOG_TTL_SECONDS:-300}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2048}
      LLM_FALLBACKS: ${LLM_FALLBACKS:-default}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-180}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      CHAT_RETRIEVAL_TOP_K: ${CHAT_RETRIEVAL_TOP_K:-8}
      CHAT_MAX_CONCURRENT_GENERATIONS: ${CHAT_MAX_CONCURRENT_GENERATIONS:-4}
      OMP_NUM_THREADS: ${BACKEND_TORCH_THREADS:-2}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    # Docker Desktop provides host.docker.internal; on Linux this maps it to the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/app:/app/app:ro
      - uploads:/data/uploads
      - model-cache:/models
    # The model takes about 2.3 GB of memory in this process (and again in the worker).
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY:-4g}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Ingestion worker: claims jobs from PostgreSQL, extracts and chunks text and runs BGE-M3.
  # Restart or scale it independently of the API.
  worker:
    build:
      context: ./backend
      target: worker
    image: yashrag-worker:dev
    environment:
      <<: *s3-settings
      DATABASE_URL: *database-url
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # AWS credentials for S3 connectors, passed through from the host environment or .env
      # (never stored in the database). Leave them empty to use AWS_PROFILE with a mounted
      # ~/.aws (docs/s3-setup.md) or an IAM role.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_PROFILE: ${AWS_PROFILE:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
      EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:-5617a9f61b028005a4858fdac845db406aefb181}
      # Docker on macOS cannot use the Apple GPU (MPS), so the container runs on CPU.
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-8}
      EMBEDDING_LOCAL_FILES_ONLY: ${EMBEDDING_LOCAL_FILES_ONLY:-false}
      CHUNK_TARGET_TOKENS: ${CHUNK_TARGET_TOKENS:-400}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-60}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      # PyTorch CPU threads; keep at or below WORKER_CPUS.
      OMP_NUM_THREADS: ${WORKER_TORCH_THREADS:-4}
    volumes:
      - ./backend/app:/app/app:ro
      - uploads:/data/uploads
      - model-cache:/models
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPUS:-4}"
          memory: ${WORKER_MEMORY:-6g}
    stop_grace_period: 45s
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    image: yashrag-frontend:dev
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

  # --- Optional S3 emulator (profile "s3-local"); not needed for Amazon S3 -------------------
  # MinIO speaks the S3 API, so the connector code path is the same as with AWS. Point the
  # worker at it with S3_ENDPOINT_URL=http://minio:9000 (see docs/s3-setup.md). Local testing
  # only: the console and API are bound to 127.0.0.1.
  minio:
    profiles: ["s3-local"]
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-yashrag-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off job: creates the sample bucket, uploads the sample documents and creates a
  # read-only user for the worker (least privilege, like the IAM policy in docs/s3-setup.md).
  minio-setup:
    profiles: ["s3-local"]
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "/setup/setup.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-yashrag-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      S3_LOCAL_BUCKET: ${S3_LOCAL_BUCKET:-yashrag-local}
      S3_LOCAL_READER_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-}
      S3_LOCAL_READER_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ./infra/s3-local:/setup:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
  # Original uploaded files, shared by the API (writes) and the worker (reads).
  uploads:
  # Hugging Face cache with the BGE-M3 weights; survives container rebuilds.
  model-cache:
  # Objects of the optional MinIO emulator (profile s3-local).
  minio-data:
