name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: yashrag
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: yashrag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yashrag -d yashrag_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throwaway credentials for the ephemeral CI database container only.
      DATABASE_URL: postgresql+psycopg://yashrag:ci-only-password@localhost:5432/yashrag_test
      TEST_DATABASE_URL: postgresql+psycopg://yashrag:ci-only-password@localhost:5432/yashrag_test
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # The optional 'embeddings' extra (PyTorch, sentence-transformers) is deliberately
      # not installed: tests use the deterministic fake provider, and the opt-in
      # real-model smoke test is skipped unless RUN_MODEL_TESTS=1.
      - name: Install dependencies (from uv.lock)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check models match migrations
        run: uv run alembic check

      - name: Pytest (unit + integration)
        run: uv run pytest

  frontend:
    name: Frontend (lint + typecheck + tests + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build
        run: npm run build

  compose:
    name: Docker Compose config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose config --services | sort | tr '\n' ' ' | tee /dev/stderr \
            | grep -q "backend db frontend migrate worker"
