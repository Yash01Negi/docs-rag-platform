name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: yashrag
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: yashrag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yashrag -d yashrag_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throwaway credentials for the ephemeral CI database container only.
      DATABASE_URL: postgresql+psycopg://yashrag:ci-only-password@localhost:5432/yashrag_test
      TEST_DATABASE_URL: postgresql+psycopg://yashrag:ci-only-password@localhost:5432/yashrag_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Pytest (unit + integration)
        run: pytest

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build

  compose:
    name: Docker Compose config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
