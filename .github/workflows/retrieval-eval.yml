# TEMPORARY verification jobs for Phase 3 (hybrid retrieval).
# The development environment cannot reach huggingface.co or download.pytorch.org, so the
# real BGE-M3 evaluation, the API image build and a second ANN benchmark run here.
# Removed once the results are recorded in docs/evaluation/.
name: Retrieval evaluation (temporary)

on:
  push:
    branches: [feature/phase-3-hybrid-retrieval]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retrieval-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-model-eval:
    name: Evaluation with the real BGE-M3 model
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: yashrag
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: yashrag_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yashrag -d yashrag_eval"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throwaway credentials for the ephemeral CI database container only.
      DATABASE_URL: postgresql+psycopg://yashrag:ci-only-password@localhost:5432/yashrag_eval
      MODEL_CACHE_DIR: /home/runner/models
      EMBEDDING_DEVICE: cpu
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          python-version: "3.12"

      - name: Install with the embeddings extra (CPU-only PyTorch on Linux)
        run: uv sync --locked --extra embeddings

      - name: Download BAAI/bge-m3
        run: uv run --extra embeddings python -m app.worker prepare-model

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Run the evaluation (keyword, semantic, hybrid)
        run: |
          uv run --extra embeddings python -m evaluation.run --reset --repeats 3 \
            --output-dir evaluation/results/bge-m3
          echo "CPU: $(nproc) x $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"
          cat evaluation/results/bge-m3/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Print results.json (gzip + base64)
        run: |
          sha256sum evaluation/results/bge-m3/results.json
          echo "RESULTS-BEGIN"
          gzip -9 -n -c evaluation/results/bge-m3/results.json | base64 -w 0
          echo
          echo "RESULTS-END"

      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation
          path: backend/evaluation/results/bge-m3/

  ann-benchmark:
    name: Exact vs HNSW benchmark
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: yashrag
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: yashrag_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yashrag -d yashrag_bench"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          python-version: "3.12"

      - run: uv sync --locked

      - name: Benchmark
        run: |
          psql "postgresql://yashrag:ci-only-password@localhost:5432/yashrag_bench" \
            -c "CREATE EXTENSION IF NOT EXISTS vector"
          echo "CPU: $(nproc) x $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"
          uv run python -m evaluation.ann_benchmark \
            --database-url postgresql://yashrag:ci-only-password@localhost:5432/yashrag_bench \
            --sizes 10000,50000,100000 --queries 50 | tee -a "$GITHUB_STEP_SUMMARY"

  api-image:
    name: API image (with the embeddings extra)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build the API and worker images
        run: |
          docker build --target api -t yashrag-backend:ci backend
          docker build --target worker -t yashrag-worker:ci backend

      - name: Measure the images
        run: |
          docker images | grep yashrag
          docker image inspect yashrag-backend:ci --format 'api image size: {{.Size}} bytes'
          docker image inspect yashrag-worker:ci --format 'worker image size: {{.Size}} bytes'

      - name: Imports and the keyword analyzer inside the API image
        run: |
          docker run --rm --entrypoint python yashrag-backend:ci -c "
          import torch, sentence_transformers
          from app.search.analyzer import analyze, analyze_query
          print('torch', torch.__version__, 'cuda build:', torch.version.cuda)
          print([t.term for t in analyze('在宅勤務の申請はVPN経由で行います。')])
          print(analyze_query('「振り返り会」 backups'))
          "
          docker run --rm --entrypoint alembic yashrag-backend:ci --help > /dev/null
