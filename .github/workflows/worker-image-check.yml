# TEMPORARY verification job for PR #1 (CPU-only PyTorch for the worker image).
# The Phase 2 build environment cannot reach download.pytorch.org, so the lockfile is
# generated and the worker image is built and measured here. Removed once verified.
name: Worker image check (temporary)

on:
  pull_request:

permissions:
  contents: read

jobs:
  worker-image:
    name: Worker image (CPU-only PyTorch)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          python-version: "3.12"

      - name: Configure the PyTorch CPU index if this commit does not have it yet
        working-directory: backend
        run: |
          if ! grep -q 'pytorch-cpu' pyproject.toml; then
            cat >> pyproject.toml <<'EOF'

          [[tool.uv.index]]
          name = "pytorch-cpu"
          url = "https://download.pytorch.org/whl/cpu"
          explicit = true

          [tool.uv.sources]
          torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
          EOF
            uv lock
            echo "LOCK_REGENERATED=1" >> "$GITHUB_ENV"
          else
            uv lock --check
          fi

      - name: Print the regenerated lockfile (gzip + base64)
        if: env.LOCK_REGENERATED == '1'
        working-directory: backend
        run: |
          sha256sum uv.lock
          echo "UVLOCK-BEGIN"
          gzip -9 -n -c uv.lock | base64 -w 0
          echo
          echo "UVLOCK-END"

      - name: Torch entries in the lock
        working-directory: backend
        run: |
          python3 - <<'EOF'
          import tomllib
          lock = tomllib.load(open("uv.lock", "rb"))
          for package in lock["package"]:
              if package["name"] in ("torch", "triton") or package["name"].startswith("nvidia"):
                  wheels = [w["url"].rsplit("/", 1)[1] for w in package.get("wheels", [])]
                  print(package["name"], package["version"], package.get("source"))
                  for wheel in wheels:
                      if "cp312" in wheel:
                          print("   ", wheel)
          EOF

      - name: Build the worker image
        run: docker build --target worker -t yashrag-worker:cpu backend

      - name: Measure the worker image
        run: |
          docker image inspect yashrag-worker:cpu --format 'image size: {{.Size}} bytes'
          docker images yashrag-worker:cpu
          docker history yashrag-worker:cpu --format '{{.Size}}\t{{.CreatedBy}}' | cut -c1-120 | head -8
          docker run --rm --entrypoint sh yashrag-worker:cpu -c \
            'du -sh /opt/venv; du -sh / --exclude=/proc --exclude=/sys 2>/dev/null | tail -1;
             ls /opt/venv/lib/python3.12/site-packages | grep -ciE "^(nvidia|triton|cuda)" || true'

      - name: Torch and sentence-transformers import in the worker image
        run: |
          docker run --rm --entrypoint python yashrag-worker:cpu -c "
          import torch, sentence_transformers
          print('torch', torch.__version__, 'cuda available:', torch.cuda.is_available())
          print('cuda build:', torch.version.cuda)
          x = torch.randn(64, 1024)
          print('matmul ok:', tuple((x @ x.T).shape))
          print('sentence-transformers', sentence_transformers.__version__)
          "
          docker run --rm --entrypoint python yashrag-worker:cpu -m app.worker --help || true

  real-model:
    name: Real BGE-M3 smoke test and PDF ingestion (temporary)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      MODEL_CACHE_DIR: /home/runner/models
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          python-version: "3.12"

      - name: Install with the embeddings extra (CPU-only PyTorch on Linux)
        run: uv sync --locked --extra embeddings

      - name: Download BAAI/bge-m3
        env:
          DATABASE_URL: postgresql+psycopg://unused:unused@127.0.0.1:1/unused
        run: uv run --extra embeddings python -m app.worker prepare-model

      - name: Real-model smoke test (RUN_MODEL_TESTS=1)
        env:
          RUN_MODEL_TESTS: "1"
        run: uv run --extra embeddings pytest -m model -v -rs -p no:cacheprovider

      - name: Index an English and a Japanese PDF with the real model
        env:
          DATABASE_URL: postgresql+psycopg://unused:unused@127.0.0.1:1/unused
          EMBEDDING_DEVICE: cpu
        run: |
          uv run --extra embeddings python - <<'EOF'
          import math, tempfile
          from pathlib import Path

          from app.core.config import Settings
          from app.db.models import FileType
          from app.embeddings import create_embedding_provider
          from app.ingestion.chunking import ChunkingConfig
          from app.ingestion.pipeline import build_index
          from tests.samples import ENGLISH_TEXT, JAPANESE_TEXT, make_pdf

          settings = Settings()
          provider = create_embedding_provider(settings)
          chunking = ChunkingConfig(
              settings.chunk_target_tokens, settings.chunk_overlap_tokens, settings.chunk_min_tokens
          )
          folder = Path(tempfile.mkdtemp())
          results = {}
          for name, pages in {
              "english.pdf": [ENGLISH_TEXT * 4, ENGLISH_TEXT * 3],
              "japanese.pdf": [JAPANESE_TEXT * 4, JAPANESE_TEXT * 3],
          }.items():
              path = folder / name
              path.write_bytes(make_pdf(pages))
              result = build_index(path, FileType.PDF, provider, chunking)
              norms = [math.sqrt(sum(v * v for v in vector)) for vector in result.vectors]
              print(
                  name, "language:", result.language, "pages:", result.page_count,
                  "chunks:", len(result.chunks), "tokens:", [c.token_count for c in result.chunks],
                  "pages per chunk:", [(c.page_start, c.page_end) for c in result.chunks],
              )
              print(
                  "  model:", result.model.name, result.model.revision,
                  "dims:", sorted({len(v) for v in result.vectors}),
                  "norms:", [round(n, 6) for n in norms],
              )
              results[name] = result
          en = results["english.pdf"].vectors[0]
          ja = results["japanese.pdf"].vectors[0]
          print("cosine(EN chunk 1, JA chunk 1):", round(sum(a * b for a, b in zip(en, ja)), 4))
          EOF
