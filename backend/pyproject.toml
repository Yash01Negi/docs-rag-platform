[project]
name = "yashrag-backend"
dynamic = ["version"]
description = "FastAPI backend for YashRAG, a bilingual (Japanese/English) document intelligence platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.143,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "psycopg[binary]>=3.3,<4",
    "alembic>=1.20,<2",
    "pgvector>=0.5,<0.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "httpx2>=2.13,<3",  # HTTP client used by FastAPI's TestClient
    "ruff==0.17.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (security)
]

[tool.ruff.lint.isort]
# The local alembic/ migrations directory would otherwise be mistaken for first-party code.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the point of tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a running PostgreSQL + pgvector database (set TEST_DATABASE_URL)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]
