# YashRAG answer (chat) evaluation set.
#
# Questions about the retrieval evaluation corpus (documents/), each judged by a person:
#
#   evidence      passages that answer the question, as {doc, anchor}: a short exact quote
#                 from the document (chunk boundaries change, so judgments never name chunks).
#                 A source given to the model counts as evidence when it contains an anchor.
#   facts         what a correct answer must state. Each fact is a list of accepted
#                 spellings; the fact is present when any spelling appears in the answer
#                 after NFKC, case folding, and removing spaces and digit-group commas
#                 ("3,000 円" matches "3000円"). This is a lexical check, not a judgment of
#                 meaning: an answer can contain the words and still be wrong, and the
#                 report says so.
#   abstain       true when the corpus does not answer the question. The ideal answer says
#                 the documents do not contain it (grounding insufficient_evidence or
#                 no_sources).
#   follow_up_of  asked in the same conversation, right after the named question.
#   answer_language  the language the answer must be written in: the question's language.
#
# Types: en_en, ja_ja (question and evidence in the same language), en_to_ja (English
# question, Japanese evidence), ja_to_en, mixed (the question mixes both), multi_source
# (evidence in two documents), follow_up, distractor (another document shares the
# question's words but does not answer it), no_answer.

version = 1

# ------------------------------------------------------------------- English -> English

[[questions]]
id = "en-en-01"
question = "How long are daily database snapshots retained?"
answer_language = "en"
types = ["en_en", "distractor"]
notes = "The SnapKeep release notes mention backups but not retention."
evidence = [{ doc = "en-backup-policy.md", anchor = "Daily snapshots are retained for 35 days" }]
facts = [["35 days", "35-day", "thirty-five days"]]

[[questions]]
id = "en-en-02"
question = "What is the recovery time objective for database restores?"
answer_language = "en"
types = ["en_en"]
evidence = [{ doc = "en-backup-policy.md", anchor = "The target recovery time objective is four hours" }]
facts = [["four hours", "4 hours", "4-hour", "four-hour"]]

[[questions]]
id = "en-en-03"
question = "What happens if nobody acknowledges a SEV1 page?"
answer_language = "en"
types = ["en_en"]
evidence = [{ doc = "en-incident-runbook.md", anchor = "If the page is not acknowledged within ten minutes" }]
facts = [["ten minutes", "10 minutes"], ["secondary on-call", "secondary"]]

[[questions]]
id = "en-en-04"
question = "What is the meal per diem for domestic business trips?"
answer_language = "en"
types = ["en_en"]
evidence = [{ doc = "en-travel-expenses.txt", anchor = "daily per diem of 60 US dollars" }]
facts = [["60"]]

[[questions]]
id = "en-en-05"
question = "And for international ones?"
follow_up_of = "en-en-04"
answer_language = "en"
types = ["en_en", "follow_up"]
notes = "Only answerable with the previous question as context."
evidence = [{ doc = "en-travel-expenses.txt", anchor = "80 US dollars for international trips" }]
facts = [["80"]]

[[questions]]
id = "en-en-06"
question = "How soon must operating system updates be installed on company laptops?"
answer_language = "en"
types = ["en_en"]
evidence = [{ doc = "en-laptop-security.md", anchor = "Operating system updates must be installed within 14 days" }]
facts = [["14 days", "fourteen days"]]

