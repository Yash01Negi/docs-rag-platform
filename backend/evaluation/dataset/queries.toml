# YashRAG retrieval evaluation set.
#
# Every query lists the passages a person judged relevant. A passage is identified by its
# document and an anchor: a short exact quote from the document. Chunk boundaries depend on
# the tokenizer, so judgments never name chunks; a retrieved chunk counts as relevant when
# it contains a judged anchor. Grades: 2 = answers the query, 1 = related but incomplete.
#
# Query types:
#   exact_keyword   the query repeats words or a phrase from the passage
#   paraphrase      same meaning, different words
#   ja_no_spaces    Japanese written without spaces (needs morphological analysis)
#   cross_language  the query and the relevant passage are in different languages
#   mixed           the query mixes Japanese and English
#   no_relevant     nothing in the corpus answers it; the ideal result is an empty list
#   multi_relevant  more than one document holds a relevant passage
#   distractor      another document shares the query's words but does not answer it
#
# `language` is the language of the query text: en, ja or mixed.

version = 1

# Smaller than the production default (400 tokens) so each short document becomes several
# chunks and the evaluation ranks passages, not whole documents. The report records it.
[chunking]
target_tokens = 120
overlap_tokens = 20
min_tokens = 20

