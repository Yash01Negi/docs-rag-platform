[[package]]
name = "yashrag-backend"
source = { editable = "." }
dependencies = [
    { name = "alembic" },
    { name = "anthropic" },
    { name = "fastapi" },
    { name = "pgvector" },
    { name = "psycopg", extra = ["binary"] },
    { name = "pydantic-settings" },
    { name = "pypdfium2" },
    { name = "python-multipart" },
    { name = "snowballstemmer" },
    { name = "sqlalchemy", extra = ["asyncio"] },
    { name = "sudachidict-core" },
    { name = "sudachipy" },
    { name = "uvicorn", extra = ["standard"] },
]

[package.optional-dependencies]
embeddings = [
    { name = "sentence-transformers" },
    { name = "torch", version = "2.14.1", source = { registry = "https://pypi.org/simple" }, marker = "sys_platform != 'linux'" },
    { name = "torch", version = "2.14.1+cpu", source = { registry = "https://download.pytorch.org/whl/cpu" }, marker = "sys_platform == 'linux'" },
]

[package.dev-dependencies]
dev = [
    { name = "httpx2" },
    { name = "pypdf" },
    { name = "pytest" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "alembic", specifier = ">=1.20,<2" },
    { name = "anthropic", specifier = ">=1.13,<2" },
    { name = "fastapi", specifier = ">=0.143,<1" },
    { name = "pgvector", specifier = ">=0.5,<0.6" },
    { name = "psycopg", extras = ["binary"], specifier = ">=3.3,<4" },
    { name = "pydantic-settings", specifier = ">=2.15,<3" },
    { name = "pypdfium2", specifier = ">=5.14,<6" },
    { name = "python-multipart", specifier = ">=0.0.32,<0.1" },
    { name = "sentence-transformers", marker = "extra == 'embeddings'", specifier = ">=6.1,<7" },
    { name = "snowballstemmer", specifier = ">=3.1,<4" },
    { name = "sqlalchemy", extras = ["asyncio"], specifier = ">=2.1,<2.2" },
    { name = "sudachidict-core", specifier = ">=20260723" },
    { name = "sudachipy", specifier = ">=0.7,<0.8" },
    { name = "torch", marker = "sys_platform == 'linux' and extra == 'embeddings'", specifier = ">=2.14,<2.15", index = "https://download.pytorch.org/whl/cpu" },
    { name = "torch", marker = "sys_platform != 'linux' and extra == 'embeddings'", specifier = ">=2.14,<2.15" },
